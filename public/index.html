<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rede Achados BR · Shopee</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="shell">
  <header><div class="brand">RA.</div><div><small>REDE ACHADOS BR</small><h1>Shopee</h1></div></header>
  <main>
    <section id="login" class="card hidden">
      <h2>Entrar</h2><p>Área administrativa da integração Shopee.</p>
      <input id="password" type="password" placeholder="Senha do aplicativo">
      <button id="loginBtn">Entrar</button><p id="loginMsg" class="msg"></p>
    </section>
    <section id="app" class="hidden">
      <div class="grid">
        <article class="card"><span class="eyebrow">CONEXÃO</span><h2 id="connTitle">Verificando…</h2><p id="connMeta"></p><div class="actions"><button id="connectBtn">Conectar Shopee</button><button class="secondary" id="testBtn">Testar loja</button><button class="secondary" id="refreshBtn">Renovar token</button></div></article>
        <article class="card"><span class="eyebrow">MÓDULOS</span><h2>Próximas etapas</h2><p>Produtos e anúncios · Pedidos e vendas · Ads · ROAS/ACOS · Lucro por SKU · Curva ABCD.</p></article>
      </div>
      <pre id="output">Aguardando ação.</pre>
    </section>
  </main>
</div>
<script src="/app.js"></script>
</body></html>
