name: Validar pesquisa de Kits pela Ponte

on:
  pull_request:
    branches: [shopee-service]
    paths:
      - 'public/kit-*'
      - 'public/index.html'
      - 'shopeeKitBuilder.js'
      - 'server.js'
      - 'tests/kitResearchHandoff.test.js'
      - 'tests/kitChatResultParser.test.js'
      - 'tests/shopeeKitBuilder.test.js'
      - '.github/workflows/kit-research-check.yml'

permissions:
  contents: read

jobs:
  pesquisa-kits:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Verificar sintaxe do fluxo de kits
        run: |
          node --check public/kit-research-handoff.js
          node --check public/kit-builder.js
          node --check public/kit-chat-result-parser.js
          node --check shopeeKitBuilder.js
          node --check server.js
      - name: Testes da Ponte e importação de kits
        run: node --test tests/kitResearchHandoff.test.js tests/kitChatResultParser.test.js tests/kitThemeValidation.test.js tests/shopeeKitBuilder.test.js tests/shopeeKitReferenceLayout.test.js
