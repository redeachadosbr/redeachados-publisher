name: Empacotar Ponte SEO 1.0.67 (temporário)

on:
  push:
    branches:
      - fix/seo-capture-4-titles-20261121
    paths-ignore:
      - 'public/downloads/Ponte_ChatGPT_Rede_Achados_BR_v1.0.67.zip'

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validar extensão e gerar ZIP de instalação
        run: |
          set -euo pipefail
          node --check chrome-extension-chatgpt/seo-automation.js
          node --test tests/seoExtensionCapture20261121.test.js
          grep -q '"version": "1.0.67"' chrome-extension-chatgpt/manifest.json
          zip -q -r public/downloads/Ponte_ChatGPT_Rede_Achados_BR_v1.0.67.zip chrome-extension-chatgpt/
          unzip -t public/downloads/Ponte_ChatGPT_Rede_Achados_BR_v1.0.67.zip | tail -1
      - name: Publicar pacote versionado no mesmo branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/Ponte_ChatGPT_Rede_Achados_BR_v1.0.67.zip
          if ! git diff --cached --quiet; then
            git commit -m "build: publicar Ponte SEO 1.0.67"
            git push
          fi
